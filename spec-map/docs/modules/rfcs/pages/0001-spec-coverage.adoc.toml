# Coverage map for RFC 0001 (docs/modules/rfcs/pages/0001-spec-coverage.adoc).
#
# Entries target blocks by the same excerpt grammar `verifies!` claims use;
# `bokfell coverage lint` lists what still needs a decision here. A
# `reason` on a non-normative entry records why that prose carries no
# rule, which answers the heuristic's question and keeps lint quiet.

reviewed = true

# Front matter and framing: status line, the proof-of-concept note, and
# the section intros that introduce a rule without stating one.
[[non-normative]]
excerpt = "Status: *draft*"
reason = "document status line"

[[non-normative]]
excerpt = "This document is also the design's first proof of concept"
reason = "explains why the RFC is itself a measured page"

[[non-normative]]
section = "_problems_with_the_interim_design"
reason = "motivation: describes the interim design's failures, states no rule"

[[non-normative]]
excerpt = "Separate the two facts, and add the states the interim design couldn't express:"
reason = "introduces the list that carries the rules"

[[non-normative]]
excerpt = "Notes on the two states the interim design lacked:"
reason = "introduces the list that carries the rules"

[[non-normative]]
excerpt = "Commands:"
reason = "introduces the command list"

# The runtime-collector variant is explicitly deferred design discussion.
[[non-normative]]
excerpt = "_Deliberately deferred:_ a proc-macro/`inventory` variant"
reason = "design discussion of a deferred alternative"

# Migration: the marker corpus statement describes the interim repos; the
# converter, parity check, and reclassification pass are planned work.
[[non-normative]]
excerpt = "The existing marker corpus is a hand-reviewed classification of every tracked page"
reason = "describes the interim repositories' state"

[[planned]]
