name: CI

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - labeled
  push:
    branches: main

env:
  CARGO_TERM_COLOR: always

# Every job below is gated on the same condition: run automatically for
# pushes, for pull requests whose head branch lives in this repository
# (pushing a branch here already requires write access, so those are
# trusted — this covers maintainers, dependabot, and Claude Code and
# other agent-authored PRs alike). Pull requests from forks await a human
# adding the "safe to test" label.
jobs:
  tests:
    name: Unit tests
    if: |
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository ||
      contains(github.event.pull_request.labels.*.name, 'safe to test')

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        rust_version: [stable, 1.88.0]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust_version }}
          components: llvm-tools-preview

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      # Runs the whole workspace test suite under source-based coverage
      # instrumentation, so this step is the test run as well as the
      # coverage measurement (a failing test fails the job). Integration
      # test files under each crate's `tests/` directory are excluded from
      # the report; inline `mod tests` blocks are stripped in the next step.
      - name: Generate code coverage
        run: cargo llvm-cov --workspace --all-features --lcov --ignore-filename-regex tests --output-path lcov.info

      - name: Remove test code from coverage reports
        uses: scouten/uncover-tests@v1

      # Tokens aren't available for PRs originating from forks, so we upload
      # coverage only for same-repo PRs (and non-PR events). We gate on the head
      # repo rather than author_association: the latter misclassifies
      # automation-authored same-repo PRs as CONTRIBUTOR and wrongly skips their
      # uploads. Dependabot pushes its branches to this repo, so it is covered
      # by the same-repo check too.
      - name: Upload code coverage results
        if: |
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.filtered.info
          # Upload only the filtered report. The action's default file search
          # also matches build fingerprints under `target/` and, worse, the
          # example site's `spec-coverage.json`, which is a Codecov-format
          # report and would be merged into the real coverage data.
          disable_search: true
          fail_ci_if_error: true
          verbose: true

  clippy:
    name: Clippy
    if: |
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository ||
      contains(github.event.pull_request.labels.*.name, 'safe to test')

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  js-tests:
    name: JS tests
    if: |
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository ||
      contains(github.event.pull_request.labels.*.name, 'safe to test')

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      # The theme's client scripts (overlay pairing, search) carry real
      # logic; their pure functions are unit-tested with Node's built-in
      # runner (preinstalled on the GitHub runners — no npm install).
      # The unquoted wildcard lets the shell expand the file list, so
      # the job works on any Node version (Node itself only globs
      # `--test` patterns from v21).
      - name: Run theme client tests
        run: node --test theme/tests/*.test.js

  fmt:
    name: Rustfmt
    if: |
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository ||
      contains(github.event.pull_request.labels.*.name, 'safe to test')

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      # rustfmt.toml uses unstable options, so format checking requires the
      # nightly toolchain (see CLAUDE.md).
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo +nightly fmt --all -- --check
