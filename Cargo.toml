[workspace]
members = [
    "aggregate",
    "cli",
    "coverage",
    "diff",
    "model",
    "render",
    "search",
    "serve",
    "theme",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/asciidoc-rs/bokfell"
# Minimum supported Rust version, matching asciidoc-parser and asciidoc-html5.
rust-version = "1.88.0"
version = "0.1.0"

# Shared dependency versions; more of the M0 technology stack (PLAN.md §7)
# lands here as it is wired in.
[workspace.dependencies]
asciidoc-html5 = "0.2.2"
asciidoc-parser = "0.31.0"
