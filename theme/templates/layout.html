<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="generator" content="Bokfell {{ bokfell_version }}">
<title>{% if page.title_text %}{{ page.title_text }} :: {% endif %}{{ site.title }}</title>
<link rel="stylesheet" href="{{ css_href | safe }}">
</head>
<body>
<header class="site-header">
  <a class="site-title" href="{{ home_href | safe }}">{{ site.title }}</a>
</header>
<div class="site-body">
  <nav class="site-nav" aria-label="Site">
{{ nav_html | safe }}
  </nav>
  <main class="doc">
    <article>
{% if page.title_html %}      <h1 class="page-title">{{ page.title_html | safe }}</h1>
{% endif %}{{ page.contents | safe }}
    </article>
  </main>
</div>
<footer class="site-footer">
  <p>Built with <a href="https://github.com/asciidoc-rs/bokfell">Bokfell</a>.</p>
</footer>
</body>
</html>
