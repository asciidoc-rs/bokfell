[package]
name = "bokfell-coverage"
description = "Spec-coverage ingestion for the Bokfell documentation site generator: per-line coverage data mapped onto rendered blocks for overlays and rollups"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords = ["asciidoc", "documentation", "coverage", "spec"]
categories = ["text-processing"]
version.workspace = true

[dependencies]
bokfell-model = { path = "../model", version = "0.1.0" }
serde_json = "1"
thiserror = "2"
