[package]
name = "bokfell-render"
description = "Catalog-aware AsciiDoc conversion for the Bokfell documentation site generator: site-wide reference resolution and embedded HTML rendering via asciidoc-html5"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords = ["asciidoc", "documentation", "html", "renderer"]
categories = ["text-processing"]
version.workspace = true

[dependencies]
asciidoc-html5.workspace = true
asciidoc-parser.workspace = true
bokfell-coverage = { path = "../coverage", version = "0.1.0" }
bokfell-diff = { path = "../diff", version = "0.1.0" }
bokfell-model = { path = "../model", version = "0.1.0" }
thiserror = "2"
