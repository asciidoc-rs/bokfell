[package]
name = "bokfell"
description = "Documentation site generator for AsciiDoc: multi-repo, versioned doc sites with live preview, version/PR diffs, and spec-coverage overlays"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

# Not ready for crates.io; flipped deliberately when 0.1 ships.
publish = false

[dependencies]
anyhow = "1"
bokfell-aggregate = { path = "../aggregate", version = "0.1.0" }
bokfell-coverage = { path = "../coverage", version = "0.1.0" }
bokfell-model = { path = "../model", version = "0.1.0" }
bokfell-render = { path = "../render", version = "0.1.0" }
bokfell-search = { path = "../search", version = "0.1.0" }
bokfell-serve = { path = "../serve", version = "0.1.0" }
bokfell-theme = { path = "../theme", version = "0.1.0" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
