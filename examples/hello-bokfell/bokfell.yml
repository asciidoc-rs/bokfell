# A minimal, self-contained Bokfell site. From this directory:
#
#     cargo run --bin bokfell -- build      # site lands in build/site
#     cargo run --bin bokfell -- serve      # http://127.0.0.1:8000/ with live reload
#
# (Or `bokfell build` / `bokfell serve` with an installed binary.)
site:
  title: Hello Bokfell
  start_page: hello::index.adoc

content:
  sources:
    - path: docs

      # Spec-coverage demo: hand-written per-line data for the home page
      # in the interim Codecov-style format (projected onto blocks at
      # build time; the second-generation engine, `bokfell coverage
      # scan`, resolves `verifies!` claims instead — see RFC 0001). It
      # puts a verified-percentage badge on the page; click it to shade
      # each block by state, and see /coverage.html for the rollup.
      coverage:
        - spec-coverage.json

output:
  dir: build/site
